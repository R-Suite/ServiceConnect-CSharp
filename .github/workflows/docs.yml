name: Build and deploy docs site

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - 'src/**'
      - 'filters/**'
      - '**/*.csproj'
      - '**/*.cs'
      - '.github/workflows/docs.yml'
      - '.config/dotnet-tools.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Restore .NET tools (DocFX)
        run: dotnet tool restore

      - name: Build .NET solution (emits XML doc files)
        run: dotnet build src/ServiceConnect.sln --configuration Release --nologo

      - name: Build API reference (DocFX)
        run: dotnet docfx website/docfx/docfx.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website (Astro + Starlight)
        working-directory: website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
